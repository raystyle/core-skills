[project]
name = "core-skills"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "coreskills-project",
    "coreskills-workspace",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
coreskills-project = { workspace = true, editable = true }
coreskills-workspace = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
